{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>System Interface | LevelUP</title>

<style>

body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: #00f0ff;
}

/* VIDEO */
video {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}

/* CENTER */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* TRUE GLASS */
.system-frame {
    width: 650px;
    padding: 70px 60px;

    background: rgba(255, 255, 255, 0.05);  /* key change */
    backdrop-filter: blur(35px) brightness(130%);
    -webkit-backdrop-filter: blur(35px) brightness(130%);

    border: 1px solid rgba(0,255,255,0.8);

    box-shadow:
        0 0 120px rgba(0,255,255,0.8),
        inset 0 0 40px rgba(0,255,255,0.3);
}

/* INNER BORDER */
.system-frame::before {
    content: "";
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    bottom: 20px;
    border: 1px solid rgba(0,255,255,0.4);
    pointer-events: none;
}

/* TITLE */
.system-title {
    text-align: center;
    font-size: 22px;
    letter-spacing: 3px;
    margin-bottom: 40px;
    padding: 12px;
    border: 1px solid rgba(0,255,255,0.6);
    box-shadow: 0 0 30px rgba(0,255,255,0.8);
}

/* INPUTS */
input {
    width: 100%;
    padding: 14px;
    margin-bottom: 25px;

    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,255,255,0.7);
    color: #00f0ff;
}

input:focus {
    outline: none;
    box-shadow: 0 0 30px #00f0ff;
}

/* BUTTON */
button {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid #00f0ff;
    color: #00f0ff;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #00f0ff;
    color: black;
    box-shadow: 0 0 40px #00f0ff;
}

</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="{% static 'videos/system-bg.mp4' %}" type="video/mp4">
</video>

<div class="container">
    <div class="system-frame">

        <div class="system-title">⚠ SYSTEM AUTHENTICATION ⚠</div>

        <form method="post">
            {% csrf_token %}
            {{ form.username.label_tag }}
            {{ form.username }}

            {{ form.password.label_tag }}
            {{ form.password }}

            <button type="submit">Enter Interface</button>
        </form>

    </div>
</div>

</body>
</html>
